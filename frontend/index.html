<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Fraud Check Demo</title></head>
<body style="font-family:sans-serif;max-width:480px;margin:40px auto">
  <h2>Fraud Check (practice demo)</h2>
  <label>Amount: <input id="amount" type="number" value="5000"></label><br><br>
  <label>Country: <input id="country" value="IN"></label><br><br>
  <button onclick="go()">Check</button>
  <pre id="out"></pre>
  <script>
    async function go() {
      const out = document.getElementById("out");
      try {
        const res = await fetch("http://localhost:8000/check", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            amount: Number(document.getElementById("amount").value),
            merchant: "demo-shop",
            country: document.getElementById("country").value
          })
        });
        out.textContent = JSON.stringify(await res.json(), null, 2);
      } catch (e) {
        out.textContent = "Error: " + e;
      }
    }
  </script>
</body>
</html>
